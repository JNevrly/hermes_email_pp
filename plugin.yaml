name: email-pp
label: Email++
kind: platform
version: 0.3.2
description: IMAP and SMTP gateway adapter with per-thread email routing.
author: Josef Nevrly
requires_env:
  - name: EMAIL_PP_ADDRESS
    description: Agent mailbox address and SMTP envelope identity.
    password: false
  - name: EMAIL_PP_PASSWORD
    description: IMAP and SMTP password or provider app password.
    password: true
  - name: EMAIL_PP_IMAP_HOST
    description: IMAP server hostname.
    password: false
  - name: EMAIL_PP_SMTP_HOST
    description: SMTP server hostname.
    password: false
  - name: EMAIL_PP_ALLOW_ALL_USERS
    description: "Enter false to keep the secure default. WARNING: true accepts every non-automated sender and bypasses allowlist and sender-authentication checks."
    password: false
optional_env:
  - name: EMAIL_PP_IMAP_PORT
    description: "IMAP-over-TLS port. Default: 993."
  - name: EMAIL_PP_SMTP_PORT
    description: "SMTP STARTTLS port; use 465 for implicit TLS. Default: 587."
  - name: EMAIL_PP_POLL_INTERVAL
    description: "Inbox polling interval in seconds. Default: 15."
  - name: EMAIL_PP_MAILBOX
    description: "Mailbox selected for polling. Default: INBOX."
  - name: EMAIL_PP_ALLOWED_USERS
    description: Comma-separated sender-address allowlist. Required unless allow all users is true.
  - name: EMAIL_PP_REQUIRE_AUTHENTICATED_SENDER
    description: "Enter true to require a passing DMARC result for allowlisted senders. Default true."
  - name: EMAIL_PP_AUTHSERV_ID
    description: Optional authentication service identifier for trusted Authentication-Results headers.
  - name: EMAIL_PP_QUOTE_MODE
    description: "Enter always, forwarded, or never. Default always."
  - name: EMAIL_PP_PROCESS_HISTORY_WINDOW
    description: "Unread cold-start recovery in seconds: 0 skips existing mail, -1 processes all, positive values process only recent mail. Default: 0."
