[project]
name = "hermes-email-pp"
version = "0.1.0"
description = "Better email adapter for Hermes Agent."
authors = [
    { name = "Josef Nevrly", email = "josef.nevrly@gmail.com" }
]
license = { text = "MIT license" }
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@e02d1e41fc6104187e20af9eac8b2820566e3508",
]

[project.entry-points."hermes_agent.plugins"]
email-pp = "hermes_email_pp.plugin:register"

[project.urls]
Homepage = "https://github.com/JNevrly/hermes_email_pp"
Repository = "https://github.com/JNevrly/hermes_email_pp"



[dependency-groups]
dev = [
    "tox>=4.34.0,<5.0.0",
    "coverage[toml]>=7.4,<8.0.0",
    "ruff>=0.14.0,<0.15.0",

    "pytest>=9.0,<10.0.0",
    "pytest-cov>=4.1,<5.0.0",

    "mypy>=1.19,<2.0.0",
]

[tool.coverage.run]
omit = [".*", "*/site-packages/*"]
source = ["hermes_email_pp"]
relative_files = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hermes_email_pp"]
