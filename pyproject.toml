[project]
name = "hermes-email-pp"
version = "0.5.2"
description = "Better email adapter for Hermes Agent."
authors = [
    { name = "Josef Nevrly", email = "josef.nevrly@gmail.com" }
]
license = { text = "MIT license" }
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "markdown>=3.10",
]

[project.entry-points."hermes_agent.plugins"]
email-pp = "hermes_email_pp.plugin"

[project.urls]
Homepage = "https://github.com/JNevrly/hermes_email_pp"
Repository = "https://github.com/JNevrly/hermes_email_pp"



[dependency-groups]
dev = [
    "tox>=4.34.0",
    "coverage[toml]>=7.4",
    "ruff>=0.14.0",

    "pytest>=9.0",
    "pytest-cov>=4.1",
    "pyyaml>=6.0",

    "mypy>=1.19",
]

[tool.coverage.run]
omit = [".*", ".release-venv/*", ".venv/*", "*/site-packages/*"]
source = ["hermes_email_pp"]
relative_files = true

[tool.pytest.ini_options]
norecursedirs = [".release-venv", ".venv", "venv", "ENV", "build", "dist"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hermes_email_pp"]

[tool.hatch.build.targets.sdist]
include = ["hermes_email_pp", "LICENSE", "README.md", "pyproject.toml"]
