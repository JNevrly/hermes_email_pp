[tox]
skipsdist = True
envlist = lint, py313, py314

[testenv:lint]
deps = uv
skip_install = true
commands =
    uv run ruff check .
    uv run ruff format --check .
    uv run mypy hermes_email_pp

[testenv]
deps = uv
skip_install = true
setenv =
    PYTHONPATH = {toxinidir}
    UV_PROJECT_ENVIRONMENT = {envdir}
commands_pre = uv sync --group dev
commands =
    uv run pytest --cov=hermes_email_pp tests/
